# ############################################################################
# Model: E2E ST with SeamlessM4T (speech encoder + text decoder)
# Encoder: SeamlessM4T speech encoder (w2v-BERT 2.0 + length adapter)
# Decoder: SeamlessM4T text decoder
# losses: NLL
# Augmentation: TimeDomainSpecAugment
# Training: Tamasheq-French corpus
# Authors:  Othman Istaiteh 2026
# ############################################################################

# Seed needs to be set at top of yaml, before objects with parameters are made
seed: 1337
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]
output_folder: !ref results/seamless/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt
bleu_file: !ref <output_folder>/bleu.txt

# root data folder points to 17h version inside the github folder (IWSLT2022_Tamasheq_data/taq_fra_clean/)
root_data_folder: !PLACEHOLDER # e.g., /path/to/IWSLT2022_Tamasheq_data/taq_fra_clean
# data folder is the place where the json files will be stored prior to training
data_folder: !ref <root_data_folder>/json_version/
lang: "fr" #for the BLEU score detokenization
target_lang: fra # SeamlessM4T code of the target language

annotation_train: !ref <data_folder>/train.json
annotation_valid: !ref <data_folder>/valid.json
annotation_test: !ref <data_folder>/test.json
skip_prep: False

# URL for the SeamlessM4T model (v1 and v2 checkpoints are supported).
seamless_hub: facebook/seamless-m4t-v2-large
seamless_folder: !ref <save_folder>/seamless_checkpoint

ckpt_interval_minutes: 15 # save checkpoint every N min

####################### Training Parameters ####################################
# Tamasheq is not one of the SeamlessM4T languages, so the speech encoder is
# fine-tuned as well.
freeze_seamless: False
freeze_encoder: False
freeze_feature_projection: False
freeze_adapter: False
freeze_decoder: False
freeze_embeddings: True # embeddings are tied with the lm_head (256k tokens)
gradient_checkpointing: True # needed for 30 s utterances on 40GB GPUs
number_of_epochs: 20
lr_seamless: 5e-5
weight_decay: 0.01
warmup_steps: 500
max_grad_norm: 5.0
# The augmented copies are concatenated to the batch (concat_original), so
# the model sees 2 x batch_size utterances per step. This setup works with
# 2x A100 40GB (utterances up to 30 s, speech encoder fine-tuned).
batch_size: 2
test_batch_size: 4
grad_accumulation_factor: 8
num_checkpoints_to_keep: 2
loss_reduction: batchmean
label_smoothing: 0.1
sorting: ascending
num_workers: 4
precision: fp16 # bf16, fp16 or fp32
eval_precision: fp16
sample_rate: 16000

# Decoding parameters
# The encoder outputs one frame every 160 ms, hence max_decode_ratio > 1.
min_decode_ratio: 0.0
max_decode_ratio: 2.0
test_beam_size: 5

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

train_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

valid_dataloader_opts:
    batch_size: !ref <test_batch_size>
    num_workers: !ref <num_workers>

test_dataloader_opts:
    batch_size: !ref <test_batch_size>
    num_workers: !ref <num_workers>

############################## models ##########################################
seamless: !new:speechbrain.integrations.huggingface.seamless_m4t.SeamlessM4T
    source: !ref <seamless_hub>
    save_path: !ref <seamless_folder>
    target_lang: !ref <target_lang>
    sampling_rate: !ref <sample_rate>
    freeze: !ref <freeze_seamless>
    freeze_encoder: !ref <freeze_encoder>
    freeze_feature_projection: !ref <freeze_feature_projection>
    freeze_adapter: !ref <freeze_adapter>
    freeze_decoder: !ref <freeze_decoder>
    freeze_embeddings: !ref <freeze_embeddings>
    gradient_checkpointing: !ref <gradient_checkpointing>

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

modules:
    seamless: !ref <seamless>

seamless_opt_class: !name:torch.optim.AdamW
    lr: !ref <lr_seamless>
    weight_decay: !ref <weight_decay>

seq_cost: !name:speechbrain.nnet.losses.nll_loss
    label_smoothing: !ref <label_smoothing>
    reduction: !ref <loss_reduction>

lr_annealing_seamless: !new:speechbrain.nnet.schedulers.NoamScheduler
    lr_initial: !ref <lr_seamless>
    n_warmup_steps: !ref <warmup_steps>

############################## Decoding ########################################
valid_search: !new:speechbrain.decoders.seq2seq.S2SSeamlessGreedySearcher
    model: !ref <seamless>
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>

test_search: !new:speechbrain.decoders.seq2seq.S2SSeamlessBeamSearcher
    module: [!ref <seamless>]
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>
    beam_size: !ref <test_beam_size>

############################## Augmentations ###################################

speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: [95, 100, 105]

# Frequency drop: randomly drops a number of frequency bands to zero.
drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: 0  # Min frequency band dropout probability
    drop_freq_high: 1  # Max frequency band dropout probability
    drop_freq_count_low: 1  # Min number of frequency bands to drop
    drop_freq_count_high: 3  # Max number of frequency bands to drop
    drop_freq_width: 0.05  # Width of frequency bands to drop

# Time drop: randomly drops a number of temporal chunks.
drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: 1000
    drop_length_high: 2000
    drop_count_low: 1
    drop_count_high: 5

# Augmenter: Combines previously defined augmentations to perform data augmentation
wav_augment: !new:speechbrain.augment.augmenter.Augmenter
    concat_original: True
    min_augmentations: 3
    max_augmentations: 3
    augment_prob: 1.0
    augmentations: [
        !ref <speed_perturb>,
        !ref <drop_freq>,
        !ref <drop_chunk>]

############################## Logging and Pretrainer ##########################
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        seamless: !ref <seamless>
        scheduler_seamless: !ref <lr_annealing_seamless>
        counter: !ref <epoch_counter>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

bleu_computer: !name:speechbrain.integrations.nlp.bleu.BLEUStats

acc_computer: !name:speechbrain.utils.Accuracy.AccuracyStats
